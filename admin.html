<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — OcePvP</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="gate" id="gate" hidden>
  <div class="card box">
    <img src="logo.webp" alt="OcePvP">
    <h1>Admin Panel</h1>
    <p>Log in to read and manage game suggestions.</p>

    <div class="notice notice-bad" id="gateError" hidden></div>

    <form id="gateForm" autocomplete="off">
      <div class="field">
        <label for="gatePass">Password</label>
        <input type="password" id="gatePass" placeholder="Admin password" required autofocus>
      </div>
      <button class="btn btn-primary" type="submit" id="gateBtn">Log in</button>
    </form>

    <a class="back" href="index.html">&larr; Back to the site</a>
  </div>
</div>

<!-- ================= PANEL ================= -->
<div id="panel" hidden>

  <header class="masthead">
    <div class="shell">
      <a class="brand" href="index.html">
        <img src="logo.webp" alt="OcePvP logo">
        <span class="name"><b>OcePvP</b><span>Admin Panel</span></span>
      </a>
      <div class="nav-right">
        <a class="btn btn-ghost btn-sm" href="games.html#suggest">View form</a>
        <button class="btn btn-ghost btn-sm" id="logout">Log out</button>
      </div>
    </div>
  </header>

  <section class="section" style="padding-top:34px">
    <div class="shell">

      <div class="admin-bar">
        <div>
          <div class="kicker" style="margin-bottom:2px">Game suggestions</div>
          <h1 style="font-size:28px;margin:0">Suggestions</h1>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
      </div>

      <div class="toolbar">
        <label class="search">
          <span aria-hidden="true" style="color:var(--dim)">&#128269;</span>
          <input id="search" type="search" placeholder="Search suggestions..." autocomplete="off">
        </label>
        <div class="chips" id="filters"></div>
      </div>

      <div class="notice notice-bad" id="panelError" hidden></div>

      <div id="list" class="sugg-list"></div>

    </div>
  </section>

</div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
